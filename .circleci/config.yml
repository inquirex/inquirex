version: 2.1

executors:
  # Pure-Ruby gem: no database, no browser, no native extensions.
  ruby:
    docker:
      - image: cimg/ruby:4.0.6
    working_directory: ~/inquirex

commands:
  sources:
    description: "Check out and install gems against the image's Ruby"
    steps:
      - checkout
      - run:
          name: Install gems
          command: |
            bundle update --bundler
            bundle install -j 4

jobs:
  scan_ruby:
    executor: ruby
    steps:
      - sources
      - run:
          name: Scan Ruby dependencies for known CVEs
          command: |
            bundle exec bundle-audit update --quiet
            bundle exec bundle-audit check

  rubocop:
    executor: ruby
    steps:
      - sources
      - run:
          name: Lint code for consistent style
          command: bundle exec rubocop

  test:
    executor: ruby
    steps:
      - sources
      - run:
          name: Run tests
          command: bundle exec rspec

workflows:
  ci:
    jobs:
      - scan_ruby
      - rubocop
      - test
